<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>MINT editor</title>
    <script>
      // The site registers a service worker at scope "/", which means it also
      // claims this page. The editor signs in through a popup that posts a
      // message back here, and a worker sitting in the middle of that handoff
      // is a good way to get a blank screen that only fixes itself on refresh.
      // The editor gains nothing from being cached, so evict it here.
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker
          .getRegistrations()
          .then(function (rs) {
            rs.forEach(function (r) {
              r.unregister();
            });
          })
          .catch(function () {});
      }
    </script>
  </head>
  <body>
    <!-- Signing in opens a popup and reads the reply from window.opener. An
         installed PWA on iOS blocks that and keeps its own storage besides, so
         the flow hangs with no explanation. Say so plainly rather than let it
         spin, and point at the way that does work. -->
    <script>
      (function () {
        var standalone =
          window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
        if (!standalone) return;
        document.addEventListener("DOMContentLoaded", function () {
          var n = document.createElement("div");
          n.setAttribute("role", "alert");
          n.style.cssText =
            "font:15px/1.5 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;" +
            "background:#7A2E28;color:#FBF8F3;padding:14px 16px;margin:0;";
          n.innerHTML =
            "<strong>Open this in your browser to sign in.</strong><br>" +
            "The installed app cannot complete the GitHub sign-in: it blocks the " +
            "popup and keeps separate storage. Tap Share, then <em>Open in Safari</em>, " +
            "or use <em>Sign In Using Access Token</em> below, which needs no popup.";
          document.body.insertBefore(n, document.body.firstChild);
        });
      })();
    </script>

    <!-- Turn the red squiggle on where Kay writes.
         =====================================================================
         Four typos went live in the 2026-08-02 post and the editor said
         nothing. Checked against the vendored bundle: Sveltia sets
         spellcheck="false" in seven places, and NOT ONE of them is the writing
         surface. They are code blocks, the number spinner, the access token
         box and the API key boxes, all correct. The Lexical root is created
         with role, class and contenteditable and NO spellcheck attribute at
         all, so it inherits whatever the browser feels like, which is not
         something to leave to chance on a phone.

         So: set it explicitly, and only where writing happens.

         THE ONE RULE THIS MUST NEVER BREAK: if an element already declares
         spellcheck, LEAVE IT ALONE. That attribute is Sveltia saying "not
         here", and it is right every time it says it. This only fills in the
         silence, it never overrules.

         MutationObserver rather than a single pass because the editor is a
         single page app: the fields for a post do not exist until you open it,
         and they are torn down and rebuilt when you open the next one. -->
    <script>
      (function () {
        // Where writing happens. [role="textbox"] and .lexical-root are the
        // markdown body; textarea is the same field in raw markdown mode,
        // which the m-arrow button at the top right switches to. Plain inputs
        // are only touched inside .field-wrapper, which is a post's own field,
        // so the sign-in and search boxes elsewhere are never candidates.
        var SURFACES = '[role="textbox"], .lexical-root, textarea, .field-wrapper input';

        function enable(root) {
          var nodes;
          try {
            nodes = root.querySelectorAll(SURFACES);
          } catch (e) {
            return;
          }
          for (var i = 0; i < nodes.length; i++) {
            var el = nodes[i];
            // Sveltia's own "false" wins. Always.
            if (el.hasAttribute("spellcheck")) continue;
            // A checkbox has nothing to spell.
            if (el.tagName === "INPUT" && !/^(text|search|)$/i.test(el.type)) continue;
            el.setAttribute("spellcheck", "true");
            el.setAttribute("data-mint-spellcheck", "on");
          }
        }

        function start() {
          enable(document);

          // THIS MUST STAY CHEAP. The body is a Lexical editor: it rewrites
          // its own DOM on every keystroke, so a naive observer that walked
          // each added node would run four selectors per character typed, on a
          // phone, while an upload is in flight. Doing the work per mutation
          // was the first version of this and it was wrong.
          //
          // Instead: mutations only set a flag. One pass runs on the next
          // animation frame, no matter how many mutations arrived, and the
          // editor is left alone in between.
          var queued = false;
          function sweep() {
            queued = false;
            enable(document);
          }
          new MutationObserver(function () {
            if (queued) return;
            queued = true;
            (window.requestAnimationFrame || window.setTimeout)(sweep, 0);
          }).observe(document.documentElement, { childList: true, subtree: true });
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", start);
        } else {
          start();
        }
      })();
    </script>

    <!-- Sveltia CMS, vendored rather than loaded from a CDN so the editor works
         offline and the version is pinned with the repo. See static/admin/VERSION. -->
    <script src="/admin/sveltia-cms.js"></script>
  </body>
</html>
