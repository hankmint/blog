# Everything, in one file, so it stops living in your head.
#
# Add a line the moment a thing happens. That is the whole discipline. It is one
# file rather than a post per item on purpose: a post is a decision and a
# commitment to write something, a line is not, and a system you have to think
# about before using is one you will stop using.
#
# kind:   building | shipped | reading | life
# date:   YYYY-MM  is enough. Exact days are not the point here.
# url:    optional
# note:   optional, one line
#
# Seeded from what came up while building this site. NOT verified against your
# records: check the dates, fix what is wrong, delete what does not belong.
#
# Top-level key is "things" because the editor's list widget writes it that way.
# A bare list at the top of the file would read a little cleaner here, but then
# the editor could not manage it, and a list only you can edit by hand is a list
# that stops getting edited.
