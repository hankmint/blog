baseURL = "https://nanakofiwrites.com/"
locale = "en"
defaultContentLanguage = "en"
title = "M I N T"
enableRobotsTXT = true
pluralizeListTitles = false

[pagination]
  pagerSize = 25

[services.rss]
  limit = 25

[taxonomies]
  category = "categories"

# Required. Post bodies imported from Micro.blog contain raw HTML img tags.
[markup.goldmark.renderer]
  unsafe = true

# A standalone image on its own line must not be wrapped in a paragraph. The
# caption render hook emits a <figure>, and a <figure> inside a <p> is invalid
# HTML that browsers silently tear apart, leaving a stray empty paragraph.
[markup.goldmark.parser]
  wrapStandAloneImageWithinParagraph = false

# Feed output.
#
# SAFETY CRITICAL. https://nanakofiwrites.com/feed.json is registered on the
# Micro.blog Sources page and is what drives cross-posting to Bluesky, Mastodon,
# Threads, LinkedIn, Tumblr, Medium, Flickr, Nostr, Pixelfed, PeerTube, Day One
# and YouTube. If that path stops returning valid JSON Feed, cross-posting stops
# silently: nothing errors, nothing warns, posts simply stop reaching the
# networks.
#
# These four blocks are carried over verbatim from Micro.blog's own exported
# config.json, so the feeds keep the exact paths and shape their relay reads.
# The service worker is a template so its cache version can be stamped at build
# time. A fixed version string meant its caches were never evicted, which served
# a stale stylesheet and a sideways photograph long after both were fixed.
[mediaTypes."text/javascript"]
  suffixes = ["js"]

[outputFormats.SW]
  mediaType = "text/javascript"
  baseName = "sw"
  isPlainText = true
  notAlternative = true

[mediaTypes."application/json"]
  suffixes = ["json"]

[outputFormats.RSS]
  baseName = "feed"

[outputFormats.JSON]
  baseName = "feed"
  mediaType = "application/json"

# Markdown output exists for ONE page, /export/, which opts in through its own
# front matter.
#
# It is NOT on `page` globally, and must not be. Every imported Micro.blog post
# carries an explicit url: ending in .html, and with two output formats Hugo
# writes both to that same path: the markdown rendered second and overwrote the
# HTML. Fifteen live posts became raw front matter in the browser. The harness
# caught it; the caption assertion failed because its fixture uses the same
# explicit-.html shape.
[mediaTypes."text/markdown"]
  suffixes = ["md"]

[outputFormats.MD]
  mediaType = "text/markdown"
  isPlainText = true
  notAlternative = false

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML"]
  taxonomy = ["HTML"]
  term = ["HTML"]

# MINT theme params, carried over from the old Micro.blog config.json.
[params]
  dateFormatToUse = "January 02, 2006"
  logoTitle = '<span class="mark">MINT</span><span class="by">by Nana Kofi</span>'
  description = "Technology, creativity and life."
  featuredCount = 2
  archive-paginate = 100

[params.author]
  name = "Nana Kofi"
