<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode | default "en" }}">
    {{ partial "head.html" . }}
    <body class="{{ block "body_class" . }}{{end}}">
        {{ partial "header.html" . }}
        {{ block "main" . }}{{ end }}
        {{ partial "footer.html" . }}

        <!-- Gallery lightbox (used by the gallery page) -->
        <div class="mint-lightbox" id="mint-lightbox" aria-hidden="true">
          <button class="lb-close" type="button" aria-label="Close">&times;</button>
          <button class="lb-btn lb-prev" type="button" aria-label="Previous">&#8249;</button>
          <button class="lb-btn lb-next" type="button" aria-label="Next">&#8250;</button>
          <div class="stage">
            <img id="mint-lb-img" alt="" />
            <div class="lb-cap" id="mint-lb-cap"></div>
          </div>
        </div>

        <script src="{{ "js/mint.js" | relURL }}"></script>
        {{ partial "custom_footer.html" . }}
        {{ range .Site.Params.plugins_js }}
            <script src="{{ . }}"></script>
        {{ end }}
    </body>
</html>
