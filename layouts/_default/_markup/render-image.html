{{- /* Turns Markdown images into captioned figures.

         ![alt text](/uploads/2026/photo.jpg "the caption")

       becomes a <figure> with a <figcaption>, picking up the caption styling
       that has been sitting unused in static/css/mint.css since the theme was
       built. Without this hook Hugo puts the caption in a title attribute,
       where it shows only as a tooltip and never appears on the page.

       Deliberately a render hook rather than a shortcode: this is plain
       Markdown, so any editor can produce it, it survives changing editors,
       and it does not litter the posts with template syntax.

       With no title it renders a plain img and no empty caption. */ -}}
{{- $alt := or .PlainText .Text -}}
{{- /* Declare the space each photograph needs. Without width and height a
       lazy <img> has no intrinsic size until it decodes, so it takes up no
       height at all and the paper shows through where the picture will be.
       Every photograph in a post did this, one collapse each, all the way
       down. See layouts/partials/img-dims.html. */ -}}
{{- $dim := partial "img-dims.html" (dict "src" .Destination) -}}
{{- $size := "" -}}
{{- if and $dim.w $dim.h -}}
  {{- $size = printf ` width="%d" height="%d"` $dim.w $dim.h | safeHTMLAttr -}}
{{- end -}}
{{- if .Title -}}
<figure>
  <img src="{{ .Destination | safeURL }}" alt="{{ $alt }}"{{ $size }} loading="lazy" />
  <figcaption>{{ .Title }}</figcaption>
</figure>
{{- else -}}
<img src="{{ .Destination | safeURL }}" alt="{{ $alt }}"{{ $size }} loading="lazy" />
{{- end -}}
