<article class="h-entry post">
	<header class="post-header">
    {{ with .Params.image }}
      <img class="u-featured" src="{{ . }}" alt="{{ $.Title | default "Photo by Nana Kofi" }}" />
    {{ end }}
		{{ if .Title }}<h2 class="p-name post-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>{{ end }}
	</header>
	<section class="p-summary post-excerpt">
      {{ .Content }}
	</section>
	<footer class="post-meta">
		<a class="u-author h-card" href="/"></a>
	<a class="read-more" href="{{ .RelPermalink }}"><time class="post-date">{{ .Date.Format (.Site.Params.dateFormatToUse | default "January 02, 2006")  }}</time></a>
	</footer>
</article>
